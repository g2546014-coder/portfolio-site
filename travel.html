<script>
    // 旅行先と写真の登録
    
const places = {

    losangeles: {
        name: "Los Angeles",
        country: "UNITED STATES",
        photos: []
    },

    perth: {
        name: "Perth",
        country: "AUSTRALIA",
        photos: []
    },

    sydney: {
        name: "Sydney",
        country: "AUSTRALIA",
        photos: []
    },


};


    const gallery = document.getElementById("gallery");
    const cityButtons = document.getElementById("city-buttons");

    // 選択した都市の写真を表示
    function selectPlace(id) {
        const place = places[id];

        if (!place) return;

        document.getElementById("detail-country")
            .textContent = place.country;

        document.getElementById("detail-name")
            .textContent = place.name;

        gallery.replaceChildren();

        place.photos.forEach(function(photo) {
            const card = document.createElement("figure");

            const img = document.createElement("img");
            img.src = photo.src;
            img.alt = photo.caption;
            img.loading = "lazy";

            img.onerror = function() {
                const missing = document.createElement("div");
                missing.className = "missing";
                missing.textContent = "写真を追加してください";
                img.replaceWith(missing);
            };

            const caption = document.createElement("figcaption");
            caption.textContent = photo.caption;

            card.append(img, caption);
            gallery.appendChild(card);
        });

        // 選択したピンと都市ボタンの色を変更
        document.querySelectorAll("[data-place]")
            .forEach(function(element) {
                const active = element.dataset.place === id;

                element.classList.toggle("active", active);

                if (element.tagName === "BUTTON") {
                    element.setAttribute(
                        "aria-pressed",
                        String(active)
                    );
                }
            });
    }

    // 都市ボタンの作成
    Object.keys(places).forEach(function(id) {
        const button = document.createElement("button");

        button.type = "button";
        button.dataset.place = id;
        button.textContent = places[id].name;

        button.addEventListener("click", function() {
            selectPlace(id);
        });

        cityButtons.appendChild(button);
    });

    // 世界地図のピンをクリック
    document.querySelectorAll(".pin")
        .forEach(function(pin) {

            pin.addEventListener("click", function() {
                selectPlace(pin.dataset.place);
            });

            // キーボード操作にも対応
            pin.addEventListener("keydown", function(event) {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    selectPlace(pin.dataset.place);
                }
            });
        });

    // 最初はLos Angelesを表示
    selectPlace("losangeles");
</script>
